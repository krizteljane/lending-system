services:
  - type: web
    name: saluag-loan
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: SALUAG Loan
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://saluag-loan.onrender.com
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: DEPLOY_ADMIN_NAME
        sync: false
      - key: DEPLOY_ADMIN_EMAIL
        sync: false
      - key: DEPLOY_ADMIN_PASSWORD
        sync: false
